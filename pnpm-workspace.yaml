packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@google/genai': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  esbuild: true
  protobufjs: false
  tree-sitter-bash: false
  tree-sitter-c: false
  tree-sitter-cpp: false
  tree-sitter-css: false
  tree-sitter-go: false
  tree-sitter-html: false
  tree-sitter-java: false
  tree-sitter-json: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-toml: false

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.80.6'
  - '@earendil-works/pi-ai@0.80.6'
  - '@earendil-works/pi-coding-agent@0.80.6'
  - '@earendil-works/pi-tui@0.80.6'

onlyBuiltDependencies:
  - esbuild

# Dev and test tooling only; nothing here reaches the published packages.
# Each lifts a transitive dependency past a Dependabot advisory.
overrides:
  source-map-js: ^1.2.2 # GHSA-68fv-2mgg-jv7q, through vite's postcss
  tinypool: ^2.1.2 # GHSA-85c8-ppgw-ccpr, GHSA-5gmw-xhrv-c9v3, through oxfmt
  vite: ^7.3.7 # GHSA-587h-7wmj-h5pm and others, through vitest
  zod: ^4.6.7 # GHSA-mrhx-c7xc-m3w5, through Pi 1.5.0 (tests)
